server:
  port: 8080
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/opspilot}
    username: ${DB_USERNAME:opspilot}
    password: ${DB_PASSWORD:opspilot}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
opspilot:
  agent-base-url: ${AGENT_BASE_URL:http://localhost:8000}
  internal-api-key: ${INTERNAL_API_KEY:change-me-in-production}

