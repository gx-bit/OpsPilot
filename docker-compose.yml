services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-opspilot}
      POSTGRES_USER: ${POSTGRES_USER:-opspilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opspilot}
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-opspilot} -d ${POSTGRES_DB:-opspilot}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    ports: ["6379:6379"]

  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports: ["5672:5672", "15672:15672"]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio_data:/data"]

  business-service:
    build: ./business-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-opspilot}
      DB_USERNAME: ${POSTGRES_USER:-opspilot}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-opspilot}
      AGENT_BASE_URL: http://agent-service:8000
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-change-me-in-production}
    ports: ["8080:8080"]
    depends_on:
      postgres:
        condition: service_healthy

  agent-service:
    build: ./agent-service
    environment:
      BUSINESS_API_URL: http://business-service:8080
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-change-me-in-production}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4.1-mini}
    ports: ["8000:8000"]
    depends_on: [business-service]

  web:
    build: ./web
    ports: ["5173:80"]
    depends_on: [business-service]

volumes:
  postgres_data:
  minio_data:

